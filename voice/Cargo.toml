[package]
name = "discord-asr-bot"
version = "0.9.2"
edition = "2021"

[dependencies]
anyhow = "1"
dotenvy = "0.15"
hound = "3.5"
rusqlite = { version = "0.37", features = ["bundled"] }
serenity = { version = "0.12", default-features = false, features = ["cache", "client", "gateway", "model", "rustls_backend", "voice"] }
songbird = { version = "0.6", features = ["receive"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

silero-vad-rust = { version = "=6.2.2", default-features = false, features = ["audio-wav"] }
ort = "=2.0.0-rc.10"
ferrous-opencc = "0.4"
chrono = { version = "0.4", default-features = false, features = ["std"] }
serde_json = "1"
ureq = { version = "=3.4.1", default-features = false, features = ["json"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
